<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Детейлинг Конфигуратор</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: #14171f;
      --card-selected: #1c2230;
      --border-color: #242a38;
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #8b949e;
      --green: #22c55e;
      --gold: #f59e0b;
      --gis-color: #00b341;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 14px 14px 110px 14px;
      overflow-x: hidden;
    }

    /* ШАПКА */
    .header {
      text-align: center;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .gis-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #142319;
      border: 1px solid var(--gis-color);
      color: #4ade80;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 179, 65, 0.15);
    }
    .gis-badge:active { transform: scale(0.96); }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin: 16px 0 8px 4px;
    }

    /* 1. КУЗОВ */
    .car-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .car-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .car-card.active {
      border-color: var(--accent-color);
      background: var(--card-selected);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .car-card .icon { font-size: 20px; margin-bottom: 2px; }
    .car-card .name { font-size: 11px; font-weight: 600; }

    /* ВКЛАДКИ КАТЕГОРИЙ (ТАБЫ) */
    .category-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tab-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }
    .tab-badge {
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: 800;
      display: none;
    }

    /* КАРТОЧКИ УСЛУГ (МУЛЬТИВЫБОР) */
    .services-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .service-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .service-card.active {
      border-color: var(--accent-color);
      background: var(--card-selected);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .service-info { display: flex; align-items: center; gap: 12px; }
    .service-check {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 2px solid #3b4253;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .service-card.active .service-check {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }
    .service-card.active .service-check::after {
      content: "✓";
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }
    .service-text .title { font-size: 13px; font-weight: 600; }
    .service-text .desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .service-price { font-size: 13px; font-weight: 700; color: var(--gold); }

    /* ДОПОЛНИТЕЛЬНЫЕ УСЛУГИ (UPSELL) */
    .addons-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .addon-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .addon-card.active {
      border-color: var(--green);
      background: #102115;
    }
    .addon-info { display: flex; align-items: center; gap: 12px; }
    .addon-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #3b4253;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .addon-card.active .addon-checkbox {
      background: var(--green);
      border-color: var(--green);
    }
    .addon-card.active .addon-checkbox::after {
      content: "✓";
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
    }
    .addon-title { font-size: 13px; font-weight: 500; }
    .addon-price { font-size: 13px; font-weight: 700; color: var(--green); }

    /* ВРЕМЯ */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .time-pill {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .time-pill.active {
      border-color: var(--accent-color);
      background: var(--card-selected);
      color: var(--accent-color);
      font-weight: 700;
    }

    /* ПОЛЯ ВВОДА */
    .inputs-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-field {
      width: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .input-field:focus { border-color: var(--accent-color); }
    .input-field.error { border-color: #ef4444 !important; background: #201315; }
    .input-hint { font-size: 11px; color: #ef4444; margin-top: -4px; margin-left: 4px; display: none; }
    textarea.input-field { resize: none; font-size: 13px; }

    /* НИЖНЯЯ ПАНЕЛЬ С АНИМАЦИЕЙ РОЛЛА */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 21, 28, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      padding: 14px 16px 22px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .total-container .total-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    
    /* СПОКОЙНАЯ РОЛЛ-ЦЕНА БЕЗ ПУЛЬСАЦИИ */
    .total-price {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      display: inline-block;
      font-variant-numeric: tabular-nums; /* Цифры одинаковой ширины для плавного счетчика */
    }

    .submit-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
      transition: all 0.2s ease;
    }
    .submit-btn:disabled {
      background: #374151 !important;
      color: #9ca3af !important;
      box-shadow: none !important;
      cursor: not-allowed;
    }
  </style>
  <style>
    .load-state { text-align:center; padding:60px 20px; color:var(--tg-theme-hint-color,#8e8e93); font-size:15px; line-height:1.5; }
    .load-state .submit-btn { max-width:220px; margin:0 auto; }
  </style>
</head>
<body>
  <!-- ШАПКА -->
  <div class="header">
    <h1 id="studio-name">Загрузка...</h1>
    <a href="#" target="_blank" class="gis-badge" id="gis-link" style="display:none"></a>
  </div>

  <div id="load-state" class="load-state">⏳ Загружаем прайс...</div>

  <div id="app" style="display:none">
    <div class="section-title" id="t-cars">1. Тип кузова</div>
    <div class="car-grid" id="car-grid"></div>

    <div class="section-title" id="t-services">2. Услуги (можно выбрать несколько)</div>
    <div class="category-tabs" id="category-tabs"></div>
    <div id="tabs-content"></div>

    <div id="addons-block">
      <div class="section-title" id="t-addons">3. Рекомендуем добавить</div>
      <div class="addons-list" id="addons-list"></div>
    </div>

    <div id="times-block">
      <div class="section-title" id="t-times">4. Удобное время</div>
      <div class="time-grid" id="time-grid"></div>
    </div>

    <div class="section-title" id="t-contacts">5. Контакты и пожелания</div>
    <div class="inputs-group">
      <input type="text" id="client-car" class="input-field" maxlength="60" placeholder="Марка и модель (например: BMW X5, Camry 70)">
      <input type="text" id="client-name" class="input-field" maxlength="50" placeholder="Ваше имя">
      <div>
        <input type="tel" id="client-phone" class="input-field" placeholder="+996 (___) __-__-__" autocomplete="tel">
        <div id="phone-error" class="input-hint">Введите все 9 цифр номера: +996 (XXX) XX-XX-XX</div>
      </div>
      <textarea id="client-comment" class="input-field" rows="2" maxlength="300" placeholder="Комментарий / пожелания к заказу (необязательно)"></textarea>
    </div>

    <div class="bottom-bar">
      <div class="total-container">
        <div class="total-label">Итого расчёт:</div>
        <div class="total-price" id="total-display">0 сом</div>
      </div>
      <button class="submit-btn" id="submit-btn">Записаться</button>
    </div>
  </div>

  <script>
    var tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { try { tg.ready(); tg.expand(); tg.enableClosingConfirmation(); } catch (e) {} }

    // ============ ДЕМО-ПРАЙС (когда ссылка открыта без параметра cfg) ============
    var DEMO_CONFIG = {
      ok: true,
      studio: { name: 'Black Star Auto Detail', address: 'г. Бишкек, ул. Гражданская, 119',
                gis_url: 'https://2gis.kg/bishkek/search/Бишкек%2C%20Гражданская%20119' },
      cars: [ { name: 'Седан', mult: 1, icon: '🚗' }, { name: 'Кроссовер', mult: 1.25, icon: '🚙' },
              { name: 'Джип / SUV', mult: 1.5, icon: '🛻' } ],
      tabs: [
        { name: '🚘 Кузов', services: [
          { name: 'Глубокая полировка кузова', desc: 'Удаление царапин + зеркальный блеск', price: 6000, icon: '💎' },
          { name: 'Бронеплёнка (зоны риска)', desc: 'Капот, бампер, фары, зеркала', price: 18000, icon: '🛡' } ] },
        { name: '🪑 Салон', services: [
          { name: 'Химчистка с полным разбором', desc: 'Снятие сидений, пола + сушка', price: 6000, icon: '✨' },
          { name: 'Экспресс-чистка салона', desc: 'Без снятия сидений, быстрая сушка', price: 3500, icon: '🧽' } ] },
        { name: '💎 Стёкла и фары', services: [
          { name: 'Полировка + броня фар', desc: 'Полиуретановая плёнка от сколов', price: 2500, icon: '💡' },
          { name: 'Нано-антидождь', desc: 'Все стёкла, гидрофоб до 6 месяцев', price: 1500, icon: '🌧' } ] }
      ],
      addons: [ { name: 'Керамика кузова (1 слой)', price: 4000, icon: '✨' },
                { name: 'Озонация (устранение запахов)', price: 800, icon: '💨' },
                { name: 'Мойка и консервация мотора', price: 1200, icon: '⚙️' } ],
      times: [ { name: 'Утро (10:00 - 14:00)', icon: '🌅' }, { name: 'День (14:00 - 18:00)', icon: '🏙' },
               { name: 'Вечер (18:00 - 21:00)', icon: '🌆' }, { name: 'Как можно скорее', icon: '⚡️' } ]
    };

    var params = new URLSearchParams(location.search);
    var STUDIO = params.get('studio') || 'demo';
    var CFG_URL = params.get('cfg') || '';
    var CACHE_KEY = 'cfg_' + STUDIO;

    var cfg = null;
    var state = { car: null, services: [], addons: [], time: null, tab: 0 };
    var currentDisplayPrice = 0;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmt(n) { return Math.round(n).toLocaleString('ru-RU').replace(/\u00a0/g, ' '); }
    function triggerHaptic() { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }
    function carMult() {
      var c = cfg.cars.filter(function (x) { return x.name === state.car; })[0];
      return c ? Number(c.mult) || 1 : 1;
    }
    function findService(name) {
      for (var i = 0; i < cfg.tabs.length; i++)
        for (var j = 0; j < cfg.tabs[i].services.length; j++)
          if (cfg.tabs[i].services[j].name === name) return cfg.tabs[i].services[j];
      return null;
    }
    function findAddon(name) { return cfg.addons.filter(function (a) { return a.name === name; })[0] || null; }

    // ======================= ОТРИСОВКА ИЗ ПРАЙСА =======================
    function render(newCfg) {
      cfg = newCfg;
      document.getElementById('studio-name').textContent = cfg.studio.name || 'Детейлинг';
      document.title = cfg.studio.name || 'Детейлинг';
      var gis = document.getElementById('gis-link');
      if (cfg.studio.address) {
        gis.style.display = '';
        gis.href = cfg.studio.gis_url || '#';
        gis.innerHTML = '📍 ' + esc(cfg.studio.address) + (cfg.studio.gis_url ? ' • <b>Построить маршрут в 2GIS ↗</b>' : '');
      } else { gis.style.display = 'none'; }

      // Сохраняем выбор клиента, если прайс обновился на лету
      if (!cfg.cars.some(function (c) { return c.name === state.car; })) state.car = cfg.cars.length ? cfg.cars[0].name : null;
      state.services = state.services.filter(function (n) { return !!findService(n); });
      state.addons = state.addons.filter(function (n) { return !!findAddon(n); });
      if (!cfg.times.some(function (t) { return t.name === state.time; })) state.time = cfg.times.length ? cfg.times[0].name : 'Ближайшее';
      if (state.tab >= cfg.tabs.length) state.tab = 0;

      // Кузов
      document.getElementById('car-grid').innerHTML = cfg.cars.map(function (c, i) {
        return '<div class="car-card' + (c.name === state.car ? ' active' : '') + '" data-car="' + i + '">' +
          '<div class="icon">' + esc(c.icon) + '</div><div class="name">' + esc(c.name) + '</div></div>';
      }).join('');

      // Вкладки и услуги
      document.getElementById('category-tabs').innerHTML = cfg.tabs.map(function (t, i) {
        return '<button class="tab-btn' + (i === state.tab ? ' active' : '') + '" data-tab="' + i + '">' +
          esc(t.name) + ' <span class="tab-badge" id="badge-' + i + '">0</span></button>';
      }).join('');
      document.getElementById('tabs-content').innerHTML = cfg.tabs.map(function (t, i) {
        return '<div class="services-list tab-content" id="tab-' + i + '" style="display:' + (i === state.tab ? 'flex' : 'none') + '">' +
          t.services.map(function (s, j) {
            var on = state.services.indexOf(s.name) > -1;
            return '<div class="service-card' + (on ? ' active' : '') + '" data-tab="' + i + '" data-svc="' + j + '">' +
              '<div class="service-info"><div class="service-check"></div><div class="service-text">' +
              '<div class="title">' + esc((s.icon ? s.icon + ' ' : '') + s.name) + '</div>' +
              (s.desc ? '<div class="desc">' + esc(s.desc) + '</div>' : '') + '</div></div>' +
              '<div class="service-price" data-base="' + Number(s.price) + '"></div></div>';
          }).join('') + '</div>';
      }).join('');

      // Допы
      var n = 3;
      document.getElementById('addons-block').style.display = cfg.addons.length ? '' : 'none';
      if (cfg.addons.length) document.getElementById('t-addons').textContent = (n++) + '. Рекомендуем добавить';
      document.getElementById('addons-list').innerHTML = cfg.addons.map(function (a, i) {
        var on = state.addons.indexOf(a.name) > -1;
        return '<div class="addon-card' + (on ? ' active' : '') + '" data-addon="' + i + '">' +
          '<div class="addon-info"><div class="addon-checkbox"></div><div class="addon-title">' +
          esc((a.icon ? a.icon + ' ' : '') + a.name) + '</div></div>' +
          '<div class="addon-price">+' + fmt(a.price) + ' с</div></div>';
      }).join('');

      // Время
      document.getElementById('times-block').style.display = cfg.times.length ? '' : 'none';
      if (cfg.times.length) document.getElementById('t-times').textContent = (n++) + '. Удобное время';
      document.getElementById('time-grid').innerHTML = cfg.times.map(function (t, i) {
        return '<div class="time-pill' + (t.name === state.time ? ' active' : '') + '" data-time="' + i + '">' +
          esc((t.icon ? t.icon + ' ' : '') + t.name) + '</div>';
      }).join('');
      document.getElementById('t-contacts').textContent = n + '. Контакты и пожелания';

      document.getElementById('load-state').style.display = 'none';
      document.getElementById('app').style.display = '';
      updatePrices();
      updateTabBadges();
      calculateTotal(true);
    }

    function updatePrices() {
      var m = carMult();
      document.querySelectorAll('.service-price').forEach(function (el) {
        el.textContent = fmt(Number(el.getAttribute('data-base')) * m) + ' с';
      });
    }

    function updateTabBadges() {
      cfg.tabs.forEach(function (t, i) {
        var cnt = t.services.filter(function (s) { return state.services.indexOf(s.name) > -1; }).length;
        var b = document.getElementById('badge-' + i);
        if (!b) return;
        b.textContent = cnt;
        b.style.display = cnt > 0 ? 'inline-block' : 'none';
      });
    }

    // ======================= КЛИКИ =======================
    document.addEventListener('click', function (e) {
      var el;
      if ((el = e.target.closest('[data-car]'))) {
        state.car = cfg.cars[+el.getAttribute('data-car')].name;
        document.querySelectorAll('.car-card').forEach(function (c) { c.classList.remove('active'); });
        el.classList.add('active');
        updatePrices(); calculateTotal(); triggerHaptic();
      } else if ((el = e.target.closest('.service-card'))) {
        var s = cfg.tabs[+el.getAttribute('data-tab')].services[+el.getAttribute('data-svc')];
        var k = state.services.indexOf(s.name);
        if (k > -1) state.services.splice(k, 1); else state.services.push(s.name);
        el.classList.toggle('active');
        updateTabBadges(); calculateTotal(); triggerHaptic();
      } else if ((el = e.target.closest('.tab-btn'))) {
        state.tab = +el.getAttribute('data-tab');
        document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        el.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(function (c) { c.style.display = 'none'; });
        document.getElementById('tab-' + state.tab).style.display = 'flex';
        triggerHaptic();
      } else if ((el = e.target.closest('[data-addon]'))) {
        var a = cfg.addons[+el.getAttribute('data-addon')];
        var j = state.addons.indexOf(a.name);
        if (j > -1) state.addons.splice(j, 1); else state.addons.push(a.name);
        el.classList.toggle('active');
        calculateTotal(); triggerHaptic();
      } else if ((el = e.target.closest('[data-time]'))) {
        state.time = cfg.times[+el.getAttribute('data-time')].name;
        document.querySelectorAll('.time-pill').forEach(function (t) { t.classList.remove('active'); });
        el.classList.add('active');
        triggerHaptic();
      } else if ((el = e.target.closest('#gis-link'))) {
        if (tg && tg.openLink && cfg.studio.gis_url) { e.preventDefault(); tg.openLink(cfg.studio.gis_url); }
      } else if (e.target.closest('#submit-btn')) {
        submitBooking();
      } else if (e.target.closest('#retry-btn')) {
        loadConfig();
      }
    });

    // ======================= СЧЁТЧИК =======================
    var animationFrameId = null;
    function calculateTotal(instant) {
      var m = carMult();
      var target = 0;
      state.services.forEach(function (n) { var s = findService(n); if (s) target += Math.round(Number(s.price) * m); });
      state.addons.forEach(function (n) { var a = findAddon(n); if (a) target += Math.round(Number(a.price)); });
      animateRollPrice(instant ? target : currentDisplayPrice, target);
      currentDisplayPrice = target;
    }
    function animateRollPrice(start, end) {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      var el = document.getElementById('total-display');
      if (start === end) { el.textContent = fmt(end) + ' сом'; return; }
      var duration = 220, t0 = performance.now();
      function roll(t) {
        var p = Math.min((t - t0) / duration, 1);
        var ease = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(start + (end - start) * ease) + ' сом';
        if (p < 1) animationFrameId = requestAnimationFrame(roll); else el.textContent = fmt(end) + ' сом';
      }
      animationFrameId = requestAnimationFrame(roll);
    }

    // ======================= ЗАГРУЗКА ПРАЙСА =======================
    function validCfg(c) { return c && c.ok && c.studio && c.cars && c.cars.length && c.tabs && c.tabs.length; }
    function showLoadError() {
      var box = document.getElementById('load-state');
      box.style.display = '';
      box.innerHTML = '😔 Не удалось загрузить прайс. Проверьте интернет.<br><br><button class="submit-btn" id="retry-btn">Повторить</button>';
    }
    function loadConfig() {
      if (!CFG_URL) { render(DEMO_CONFIG); return; }
      var cachedOk = false;
      try {
        var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (validCfg(cached)) { render(cached); cachedOk = true; }   // мгновенно показываем сохранённый
      } catch (e) {}
      if (!cachedOk) {
        var box = document.getElementById('load-state');
        box.style.display = ''; box.textContent = '⏳ Загружаем прайс...';
      }
      var url = CFG_URL + (CFG_URL.indexOf('?') > -1 ? '&' : '?') + 'action=config&t=' + Date.now();
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
      fetch(url, ctrl ? { signal: ctrl.signal } : {})
        .then(function (r) { return r.json(); })
        .then(function (data) {
          clearTimeout(timer);
          if (!validCfg(data)) throw new Error('bad config');
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));
          render(data);                                                   // обновляем на свежий
        })
        .catch(function () { clearTimeout(timer); if (!cachedOk) showLoadError(); });
    }

    // ======================= МАСКА ТЕЛЕФОНА =======================
    var phoneInput = document.getElementById('client-phone');
    function formatKGPhoneString(digitsOnly) {
      if (!digitsOnly) return '+996';
      var d = digitsOnly;
      if (d.startsWith('0')) d = '996' + d.substring(1);
      if (!d.startsWith('996')) d = '996' + d;
      d = d.substring(0, 12);
      var res = '+996';
      if (d.length > 3) res += ' (' + d.substring(3, 6);
      if (d.length >= 6) res += ') ' + d.substring(6, 8);
      if (d.length >= 8) res += '-' + d.substring(8, 10);
      if (d.length >= 10) res += '-' + d.substring(10, 12);
      return res;
    }
    phoneInput.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && this.selectionStart === this.selectionEnd) {
        var cursor = this.selectionStart, val = this.value;
        if (cursor <= 5) { e.preventDefault(); return; }
        var prevChar = val[cursor - 1];
        if (['-', ' ', ')', '('].includes(prevChar)) {
          e.preventDefault();
          var digits = val.replace(/\D/g, '');
          var before = val.slice(0, cursor).replace(/\D/g, '').length;
          if (before > 3) {
            this.value = formatKGPhoneString(digits.slice(0, before - 1) + digits.slice(before));
            var nc = Math.max(5, cursor - 2);
            this.setSelectionRange(nc, nc);
          }
        }
      }
    });
    phoneInput.addEventListener('input', function (e) {
      e.target.value = formatKGPhoneString(e.target.value.replace(/\D/g, ''));
      document.getElementById('phone-error').style.display = 'none';
      e.target.classList.remove('error');
    });

    // ======================= ОТПРАВКА =======================
    function submitBooking() {
      var carModel = document.getElementById('client-car').value.trim() || 'Не указана';
      var name = document.getElementById('client-name').value.trim();
      var comment = document.getElementById('client-comment').value.trim() || 'Нет';
      var rawPhone = phoneInput.value.replace(/\D/g, '');

      var lastSubmit = Number(localStorage.getItem('last_booking_' + STUDIO) || 0);
      if (Date.now() - lastSubmit < 60000) {
        alert('Вы уже отправили заявку! Мастер студии свяжется с вами в ближайшее время.');
        return;
      }
      if (!state.services.length && !state.addons.length) { alert('Пожалуйста, выберите хотя бы одну услугу'); return; }
      if (!name || name.length < 2) { alert('Пожалуйста, укажите ваше имя'); document.getElementById('client-name').focus(); return; }
      if (rawPhone.length !== 12) {
        phoneInput.classList.add('error');
        document.getElementById('phone-error').style.display = 'block';
        phoneInput.focus();
        return;
      }

      var btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Отправка заявки...';

      var payload = {
        v: 2, studio: STUDIO,
        carType: state.car, carModel: carModel,
        services: state.services.slice(), addons: state.addons.slice(),
        time: state.time, totalPrice: currentDisplayPrice,
        comment: comment, name: name, phone: phoneInput.value
      };
      localStorage.setItem('last_booking_' + STUDIO, String(Date.now()));

      if (tg && tg.sendData && tg.platform !== 'unknown') {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        tg.sendData(JSON.stringify(payload));   // приложение закроется, чек придёт от бота
      } else {
        alert('✅ Демо-режим (открыто вне Telegram). Заявка:\n' + JSON.stringify(payload, null, 2));
        localStorage.removeItem('last_booking_' + STUDIO);
        setTimeout(function () { btn.disabled = false; btn.textContent = 'Записаться'; }, 1500);
      }
    }

    loadConfig();
  </script>
</body>
</html>
